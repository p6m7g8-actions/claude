name: Claude Code Review
description: Run Claude Code review on a pull request via anthropics/claude-code-action

inputs:
  anthropic_api_key:
    description: "Anthropic API key"
    required: true
  prompt:
    description: "Prompt to send to Claude"
    required: false
    default: "Review this pull request for code quality, bugs, and best practices. Be concise."

runs:
  using: composite
  steps:
    - uses: p6m7g8-actions/checkout@main

    # Pinned to an exact upstream release per the fleet policy: third-party
    # actions take a v-tag pin, never a moving ref. This was `@beta`, where
    # `direct_prompt` had already been renamed to `prompt`, so the review
    # prompt was being discarded as an unknown input and every review ran on
    # upstream defaults.
    - uses: anthropics/claude-code-action@v1.0.183
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        prompt: ${{ inputs.prompt }}
