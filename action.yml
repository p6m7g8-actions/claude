name: Claude Code Review
description: Run Claude Code review on a pull request via anthropics/claude-code-action

inputs:
  anthropic_api_key:
    description: "Anthropic API key"
    required: true
  prompt:
    description: >-
      Prompt to send to Claude. An override replaces the default wholesale, so
      any override that still needs to be machine-readable must carry the
      verdict contract instruction forward itself.
    required: false
    default: |
      Review this pull request for code quality, bugs, and best practices. Be concise.

      End every review with exactly these three lines, in this order, as the
      final three lines of your comment, with no text, blank line, or markup
      after them:

      Review-Lane: code
      Overall: patch is correct
      Findings (total): 0

      Rules for those three lines:
      - Emit all three verbatim on every review, including when you found
        nothing at all. They are never omitted, reordered, or reworded.
      - `Review-Lane: code` is a fixed literal. Copy it exactly.
      - Write `Overall: patch is incorrect` in place of
        `Overall: patch is correct` when at least one finding you reported is
        merge-blocking. Otherwise write `Overall: patch is correct`.
      - Replace the `0` in `Findings (total): 0` with the number of findings
        you reported. Emit the line even when that number is 0.
      - They go last, not first. A tracking header is prepended to your
        comment, so the start of the comment is not yours to control; the end
        is.
      - A downstream tool matches these strings literally. Do not wrap them in
        bold, a code fence, a list marker, or a table, and do not add
        punctuation.
  track_progress:
    description: >-
      Force tag mode with tracking comments on pull_request events. This is the
      mechanism that gives Claude a comment to publish the review into. Set to
      "false" to opt out and handle publication yourself.
    required: false
    default: "true"
  use_sticky_comment:
    description: >-
      Deliver the review in a single comment that is updated in place across
      pushes, rather than accumulating one comment per run. Set to "false" for
      one comment per run.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: p6m7g8-actions/checkout@main

    # Pinned to an exact upstream release per the fleet policy: third-party
    # actions take a v-tag pin, never a moving ref. This was `@beta`, where
    # `direct_prompt` had already been renamed to `prompt`, so the review
    # prompt was being discarded as an unknown input and every review ran on
    # upstream defaults.
    #
    # `track_progress` and `use_sticky_comment` both default to "false"
    # upstream. With neither set, the action ran the review to completion and
    # then discarded it: no tracking comment existed to write into and the
    # prompt does not itself instruct publication. The result was a green
    # check that produced no artifact. Defaulting both to "true" here makes
    # the review land as one comment that is updated in place.
    #
    # `display_report` is deliberately left at its upstream default of
    # "false": it writes Claude-authored content into the GitHub Step Summary
    # and upstream restricts it to trusted input only.
    - uses: anthropics/claude-code-action@v1.0.183
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        prompt: ${{ inputs.prompt }}
        track_progress: ${{ inputs.track_progress }}
        use_sticky_comment: ${{ inputs.use_sticky_comment }}
